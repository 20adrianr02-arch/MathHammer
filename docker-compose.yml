services:
  api:
    build:
      context: .
      dockerfile: src/MathHammer.Api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    restart: unless-stopped

  web:
    build:
      context: ./frontend/MathHammer.Web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    ports:
      - "8081:80"
    depends_on:
      - api
    restart: unless-stopped