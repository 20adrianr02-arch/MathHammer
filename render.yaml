# Blueprint de Render para MathHammer.
services:
  - type: web
    name: mathhammer-api
    runtime: docker
    plan: free
    dockerfilePath: src/MathHammer.Api/Dockerfile
    envVars:
      - key: ASPNETCORE_URLS
        value: http://+:10000
      - key: Cors__Origenes__0
        value: https://mathhammer-web.onrender.com

  - type: web
    name: mathhammer-web
    runtime: static
    buildCommand: npm --prefix frontend/MathHammer.Web ci && npm --prefix frontend/MathHammer.Web run build
    staticPublishPath: frontend/MathHammer.Web/dist
    envVars:
      - key: VITE_API_URL
        value: https://mathhammer-api.onrender.com
